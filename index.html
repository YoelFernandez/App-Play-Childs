<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explora, escucha y juega mientras conoces animales de todo el mundo."
    />
    <meta name="theme-color" content="#12372a" />
    <title>Mundo Animal · Aprende jugando</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Saltar al contenido</a>

    <header class="site-header">
      <button class="brand" id="brand-home" type="button" aria-label="Ir al inicio">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span>
          <strong>Mundo Animal</strong>
          <small>Explora · Aprende · Juega</small>
        </span>
      </button>
      <nav class="header-actions" aria-label="Navegación principal">
        <button class="header-home" id="header-home" type="button">
          <span aria-hidden="true">⌂</span>
          <span>Inicio</span>
        </button>
      </nav>
    </header>

    <main id="app" tabindex="-1"></main>

    <footer class="site-footer">
      <span aria-hidden="true">✦</span>
      <p>Hecho para pequeños exploradores curiosos.</p>
      <span aria-hidden="true">✦</span>
    </footer>

    <div class="modal" id="modal" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <section
        class="modal-panel"
        id="modal-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <div class="modal-top-actions">
          <button class="modal-close" type="button" data-close-modal aria-label="Cerrar ventana">
            ×
          </button>
          <div class="modal-audio-toolbar" id="modal-audio-toolbar"></div>
        </div>
        <div id="modal-content"></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <audio id="animal-audio" preload="none"></audio>

    <script src="app.js" defer></script>
  </body>
</html>
